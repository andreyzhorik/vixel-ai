<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VIXEL AI | Gemini Flash</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Markdown & Syntax Highlighting Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #141414;
            --accent: #ff2e2e;
            --accent-hover: #cc0000;
            --text: #eeeeee;
            --user-msg: #2a2a2a;
            --ai-msg: #1e1e1e;
            --border: #333333;
            --code-bg: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        header h1 { font-size: 1.2rem; letter-spacing: 2px; color: var(--accent); }

        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .msg { 
            max-width: 85%; 
            padding: 14px 20px; 
            border-radius: 15px; 
            font-size: 15px; 
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg.user { 
            align-self: flex-end; 
            background: var(--accent); 
            color: white;
            border-bottom-right-radius: 2px;
        }
        .msg.assistant { 
            align-self: flex-start; 
            background: var(--ai-msg); 
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        /* --- Markdown Formatting Styles --- */
        .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { margin: 15px 0 10px; color: var(--accent); }
        .msg.assistant p { margin-bottom: 10px; }
        .msg.assistant p:last-child { margin-bottom: 0; }
        .msg.assistant code { 
            background: var(--code-bg); 
            padding: 2px 5px; 
            border-radius: 4px; 
            font-family: monospace; 
            font-size: 0.9em;
            border: 1px solid var(--border);
        }
        .msg.assistant pre { 
            background: var(--code-bg); 
            padding: 15px; 
            border-radius: 8px; 
            overflow-x: auto; 
            margin: 15px 0;
            border: 1px solid var(--border);
        }
        .msg.assistant pre code { background: none; padding: 0; border: none; }
        .msg.assistant ul, .msg.assistant ol { margin-left: 20px; margin-bottom: 10px; }
        .msg.assistant blockquote { 
            border-left: 4px solid var(--accent); 
            padding-left: 15px; 
            color: #aaa; 
            font-style: italic; 
            margin: 10px 0;
        }
        .msg.assistant table { 
            border-collapse: collapse; 
            width: 100%; 
            margin: 15px 0; 
            font-size: 14px;
        }
        .msg.assistant th, .msg.assistant td { 
            border: 1px solid var(--border); 
            padding: 8px; 
            text-align: left; 
        }
        .msg.assistant th { background: var(--panel); }

        /* Input Area */
        .controls {
            background: var(--panel);
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: var(--bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        textarea { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: white; 
            resize: none; 
            padding: 10px;
            font-size: 15px;
            outline: none;
            height: 45px;
            max-height: 200px;
        }
        button { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 0 20px; 
            border-radius: 8px; 
            font-weight: 600;
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .typing { font-style: italic; color: #888; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <h1>VIXEL AI <span style="font-weight: 300; opacity: 0.7; font-size: 0.8rem;">| GEMINI FLASH</span></h1>
</header>

<div id="chat">
    <div class="msg assistant">Hello! welcome to vixel ai :)</div>
</div>

<div class="controls">
    <div class="input-wrapper">
        <textarea id="prompt" placeholder="Ask me anything..."></textarea>
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
const chatEl = document.getElementById("chat");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

const WORKER_URL = "https://plain-pine-b32a.mrviktor2426.workers.dev/";

// Configure Marked to use Highlight.js
marked.setOptions({
    highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
    },
    breaks: true,
    gfm: true
});

function appendMsg(content, role) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    
    if (role === "assistant") {
        // Render Markdown for AI responses
        div.innerHTML = marked.parse(content);
    } else {
        // Plain text for user messages for security/simplicity
        div.textContent = content;
    }
    
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = promptEl.value.trim();
    if (!text || sendBtn.disabled) return;

    appendMsg(text, "user");
    promptEl.value = "";
    promptEl.style.height = '45px';
    
    sendBtn.disabled = true;
    const loadingMsg = appendMsg("Vixel is thinking...", "assistant");
    loadingMsg.classList.add("typing");

    try {
        const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: [{ role: "user", content: text }] })
        });
        const data = await res.json();
        
        loadingMsg.classList.remove("typing");
        const aiResponse = data.output_text || "⚠️ No response from AI.";
        
        // Use innerHTML with marked.parse for the final response
        loadingMsg.innerHTML = marked.parse(aiResponse);
        
        // Trigger syntax highlighting for any new code blocks
        loadingMsg.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
        });

    } catch (err) {
        loadingMsg.textContent = "❌ Error: " + err.message;
        loadingMsg.style.color = "#ff4444";
    } finally {
        sendBtn.disabled = false;
        chatEl.scrollTop = chatEl.scrollHeight;
    }
}

sendBtn.onclick = sendMessage;

promptEl.addEventListener('input', function() {
    this.style.height = '45px';
    this.style.height = (this.scrollHeight) + 'px';
});

promptEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
