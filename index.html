<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VIXEL AI | Gemini Flash</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #141414;
            --accent: #ff2e2e;
            --accent-hover: #cc0000;
            --text: #eeeeee;
            --user-msg: #2a2a2a;
            --ai-msg: #1e1e1e;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        header h1 { font-size: 1.2rem; letter-spacing: 2px; color: var(--accent); }

        /* Chat Area */
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .msg { 
            max-width: 80%; 
            padding: 12px 18px; 
            border-radius: 15px; 
            font-size: 15px; 
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg.user { 
            align-self: flex-end; 
            background: var(--accent); 
            color: white;
            border-bottom-right-radius: 2px;
        }
        .msg.assistant { 
            align-self: flex-start; 
            background: var(--ai-msg); 
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        /* Input Area */
        .controls {
            background: var(--panel);
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: var(--bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        textarea { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: white; 
            resize: none; 
            padding: 10px;
            font-size: 15px;
            outline: none;
            height: 45px;
        }
        button { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 0 20px; 
            border-radius: 8px; 
            font-weight: 600;
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .typing { font-style: italic; color: #888; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <h1>VIXEL AI <span style="font-weight: 300; opacity: 0.7; font-size: 0.8rem;">| GEMINI FLASH</span></h1>
</header>

<div id="chat">
    <div class="msg assistant">Hello! How can I help you today?</div>
</div>

<div class="controls">
    <div class="input-wrapper">
        <textarea id="prompt" placeholder="Ask me anything..."></textarea>
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
const chatEl = document.getElementById("chat");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

// ⚠️ Replace with your actual Worker URL
const WORKER_URL = "https://plain-pine-b32a.mrviktor2426.workers.dev/";

function appendMsg(text, role) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if(text === "…") div.classList.add("typing");
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = promptEl.value.trim();
    if (!text || sendBtn.disabled) return;

    appendMsg(text, "user");
    promptEl.value = "";
    promptEl.style.height = '45px';
    
    sendBtn.disabled = true;
    const loadingMsg = appendMsg("Vixel is thinking...", "assistant");

    try {
        const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: [{ role: "user", content: text }] })
        });
        const data = await res.json();
        loadingMsg.textContent = data.output_text || "⚠️ No response from AI.";
        loadingMsg.classList.remove("typing");
    } catch (err) {
        loadingMsg.textContent = "❌ Error: " + err.message;
        loadingMsg.style.color = "#ff4444";
    } finally {
        sendBtn.disabled = false;
    }
}

sendBtn.onclick = sendMessage;

// Auto-expand textarea
promptEl.addEventListener('input', function() {
    this.style.height = '45px';
    this.style.height = (this.scrollHeight) + 'px';
});

promptEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
